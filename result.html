<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Question Paper Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: #fdecef;

            margin: 0;

            padding: 30px 15px;

            color: #4f3540;
        }


        .paper-card {

            max-width: 1000px;

            margin: auto;

            background: #fff8fa;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 8px 25px rgba(196, 90, 120, 0.18);

            border: 1px solid #f2cbd5;
        }


        /* Main Heading */

        h1 {

            text-align: center;

            color: #c45a78;

            margin-top: 0;

            margin-bottom: 8px;

            font-size: 30px;
        }


        .subtitle {

            text-align: center;

            color: #9b6575;

            margin-bottom: 30px;

            font-size: 15px;
        }


        /* Paper Details */

        .details {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;

            margin: 20px 0 25px;
        }


        .detail-box {

            background: #fce8ed;

            padding: 14px 16px;

            border-radius: 10px;

            border-left: 4px solid #d97896;

        }


        .detail-box strong {

            color: #8d4d62;
        }


        hr {

            border: none;

            border-top: 2px solid #f0cbd5;

            margin: 25px 0;
        }


        /* AI Question Paper */

        .ai-content {

            white-space: pre-wrap;

            line-height: 1.8;

            font-size: 16px;

            background: #ffffff;

            padding: 25px;

            border-radius: 14px;

            border: 1px solid #f0d1d9;

            overflow-wrap: break-word;

            color: #403239;
        }


        /* Buttons */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            margin-top: 30px;

            flex-wrap: wrap;
        }


        .buttons a {

            text-decoration: none;
        }


        .buttons button {

            border: none;

            padding: 12px 22px;

            border-radius: 10px;

            font-size: 15px;

            cursor: pointer;

            color: white;

            transition: 0.2s;

            margin: 0;
        }


        .download-btn {

            background: #d97896;
        }


        .download-btn:hover {

            background: #c45a78;

            transform: translateY(-1px);
        }


        .print-btn {

            background: #b87591;
        }


        .print-btn:hover {

            background: #9f5d78;

            transform: translateY(-1px);
        }


        .home-btn {

            background: #e5a5b8;
        }


        .home-btn:hover {

            background: #d58ba2;

            transform: translateY(-1px);
        }


        /* Mobile */

        @media (max-width: 700px) {

            body {

                padding: 15px 10px;
            }


            .paper-card {

                padding: 20px;

                border-radius: 15px;
            }


            h1 {

                font-size: 24px;
            }


            .details {

                grid-template-columns: 1fr;
            }


            .ai-content {

                padding: 18px;

                font-size: 15px;
            }


            .buttons {

                flex-direction: column;
            }


            .buttons button {

                width: 100%;

                min-width: 220px;
            }

        }


        /* Print */

        @media print {

            body {

                background: white;

                padding: 0;
            }


            .paper-card {

                box-shadow: none;

                border: none;

                max-width: 100%;

                margin: 0;

                padding: 10px;
            }


            .buttons {

                display: none;
            }


            .ai-content {

                border: none;

                padding: 0;

                background: white;
            }


            .details {

                break-inside: avoid;
            }

        }

    </style>

</head>


<body>

<div class="paper-card">


    <!-- Heading -->

    <h1>🤖 AI Question Paper Generator</h1>

    <div class="subtitle">

        Your AI-generated question paper is ready

    </div>


    <!-- Paper Details -->

    <div class="details">


        <div class="detail-box">

            <strong>Subject:</strong>

            {{ paper.subject }}

        </div>


        <div class="detail-box">

            <strong>Topic:</strong>

            {{ paper.topic }}

        </div>


        <div class="detail-box">

            <strong>Difficulty:</strong>

            {{ paper.difficulty }}

        </div>


        <div class="detail-box">

            <strong>Total Questions:</strong>

            {{ paper.questions }}

        </div>


        <div class="detail-box">

            <strong>Total Marks:</strong>

            {{ paper.marks }}

        </div>


        <div class="detail-box">

            <strong>Date:</strong>

            {{ paper.date }}

        </div>


        <div class="detail-box">

            <strong>Time:</strong>

            {{ paper.time }}

        </div>


    </div>


    <hr>


    <!-- Generated Questions -->

    <div class="ai-content">

        {{ paper.content }}

    </div>


    <!-- Buttons -->

    <div class="buttons">


        <a href="/download?subject={{ paper.subject | urlencode }}&topic={{ paper.topic | urlencode }}&questions={{ paper.questions }}&difficulty={{ paper.difficulty | urlencode }}&marks={{ paper.marks }}&content={{ paper.content | urlencode }}">

            <button class="download-btn">

                ⬇ Download PDF

            </button>

        </a>


        <button
            class="print-btn"
            onclick="window.print()">

            🖨 Print Paper

        </button>


        <a href="/">

            <button class="home-btn">

                🏠 Generate Another Paper

            </button>

        </a>


    </div>


</div>

</body>

</html>
