<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Question Paper Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #eaf6fb;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #168aad;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #b9dce8;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            border-color: #168aad;
            box-shadow: 0 0 0 2px rgba(22, 138, 173, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #168aad;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #117494;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #168aad;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                margin: 10px auto;
                padding: 22px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Question Paper Generator</h1>

    <div class="subtitle">
        Generate customized question papers using Artificial Intelligence
    </div>

    <form action="/generate" method="POST" onsubmit="showLoading()">

        <label for="subject">Subject</label>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter subject name"
            required
        >

        <label for="topic">Topic Name</label>
        <input
            type="text"
            id="topic"
            name="topic"
            placeholder="Enter topic name"
            required
        >

        <label for="language">Question Paper Language</label>
        <select id="language" name="language" required>
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Urdu">Urdu</option>
            <option value="French">French</option>
            <option value="Korean">Korean</option>
            <option value="Spanish">Spanish</option>
            <option value="German">German</option>
            <option value="Japanese">Japanese</option>
            <option value="Chinese">Chinese</option>
            <option value="Arabic">Arabic</option>
            <option value="Other">Other</option>
        </select>

        <label for="total_questions">Total Questions</label>
        <input
            type="number"
            id="total_questions"
            name="total_questions"
            min="1"
            max="100"
            placeholder="Enter number of questions"
            required
        >

        <label for="difficulty">Difficulty Level</label>
        <select id="difficulty" name="difficulty" required>
            <option value="Easy">Easy</option>
            <option value="Medium" selected>Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <label for="total_marks">Total Marks</label>
        <input
            type="number"
            id="total_marks"
            name="total_marks"
            min="1"
            max="500"
            placeholder="Enter total marks"
            required
        >

        <button type="submit" class="btn">
            Generate Question Paper
        </button>

    </form>

    <div id="loading" class="loading">
        Generating your question paper... Please wait.
    </div>

    <footer>
        AI-based Question Paper Generation System
    </footer>

</div>

<script>
    function showLoading() {
        document.getElementById("loading").style.display = "block";
    }
</script>

</body>
</html>
